<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code 对话查看器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "Segoe UI", sans-serif;
  background: #1a1a2e; color: #e0e0e0;
  line-height: 1.6; display: flex;
}

/* ── Left sidebar: file list ── */
.sidebar-files {
  width: 260px; min-width: 0;
  background: #12122a; border-right: 1px solid #2a2a4a;
  display: flex; flex-direction: column; height: 100vh;
  transition: width 0.2s; overflow: hidden;
}
.sidebar-files.collapsed { width: 42px; min-width: 42px; }
.sidebar-files.collapsed .sb-header > *:not(.sb-toggle) { display: none; }
.sidebar-files.collapsed .file-items { display: none; }
.sidebar-files .sb-header {
  padding: 16px; border-bottom: 1px solid #2a2a4a;
}
.sb-toggle {
  background: none; border: none; color: #888; cursor: pointer;
  font-size: 1.1em; padding: 2px 6px; border-radius: 4px; transition: color 0.15s;
}
.sb-toggle:hover { color: #c9a0ff; }
.sidebar-files .sb-header h2 {
  color: #c9a0ff; font-size: 0.95em; margin-bottom: 8px;
}
.sidebar-files .sb-status {
  color: #666; font-size: 0.75em; margin-top: 6px;
}
.sidebar-files .sb-actions {
  display: flex; gap: 6px; margin-top: 8px;
}
.sb-btn {
  flex: 1; padding: 5px 8px; border-radius: 6px; border: 1px solid #333;
  background: #1a1a3a; color: #888; cursor: pointer;
  font-size: 0.72em; transition: all 0.2s; text-align: center;
}
.sb-btn:hover { border-color: #4fc3f7; color: #4fc3f7; }

.file-search {
  width: 100%; padding: 6px 10px; border-radius: 6px;
  border: 1px solid #2a2a4a; background: #0e0e22; color: #ccc;
  font-size: 0.8em; outline: none;
}
.file-search:focus { border-color: #4fc3f7; }
.file-items {
  flex: 1; overflow-y: auto; padding: 6px;
}
.file-items::-webkit-scrollbar { width: 4px; }
.file-items::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.file-item {
  padding: 7px 10px; margin: 2px 0; border-radius: 6px;
  cursor: pointer; font-size: 0.8em; transition: background 0.15s;
  border-left: 2px solid transparent;
}
.file-item:hover { background: #1a1a3e; }
.file-item.active { background: #1e1e3e; border-left-color: #4fc3f7; }
.file-item .fname {
  color: #ddd; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-all;
}
.file-item.expanded .fname { -webkit-line-clamp: unset; }
.file-item .fpath { color: #555; font-size: 0.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-item .fdate {
  color: #4fc3f7; font-size: 0.75em; opacity: 0.7; margin-top: 1px;
}
.repo-group { margin-bottom: 8px; }
.repo-group-title {
  padding: 8px 10px 4px; color: #666; font-size: 0.68em;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.repo-tag {
  display: inline-block; font-size: 0.68em; padding: 1px 5px;
  border-radius: 3px; background: rgba(201,160,255,0.15); color: #c9a0ff;
  margin-right: 6px; vertical-align: middle;
}

/* ── Left sub-sidebar: questions ── */
.sidebar-questions {
  width: 240px; min-width: 0;
  background: #141430; border-right: 1px solid #2a2a4a;
  display: flex; flex-direction: column; height: 100vh;
  transition: width 0.2s; overflow: hidden;
}
.sidebar-questions.collapsed { width: 42px; min-width: 42px; }
.sidebar-questions.collapsed .sb-header > *:not(.sb-toggle) { display: none; }
.sidebar-questions.collapsed .q-items,
.sidebar-questions.collapsed .q-export-btn { display: none; }
.sidebar-questions .sb-header {
  padding: 14px; border-bottom: 1px solid #2a2a4a;
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-questions .sb-header h3 { color: #4fc3f7; font-size: 0.88em; }
.q-count { color: #666; font-size: 0.75em; }
.q-items { flex: 1; overflow-y: auto; padding: 6px; }
.q-items::-webkit-scrollbar { width: 4px; }
.q-items::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.q-item {
  padding: 8px 10px; margin: 2px 0; border-radius: 6px;
  cursor: pointer; font-size: 0.78em; color: #aaa;
  transition: background 0.15s; border-left: 2px solid transparent;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-all;
}
.q-item.expanded { -webkit-line-clamp: unset; }
.q-item:hover { background: #1a1a3e; color: #ddd; }
.q-item.active { border-left-color: #c9a0ff; color: #e0e0e0; background: #1e1e3e; }
.q-item .q-num { color: #4fc3f7; font-size: 0.9em; margin-right: 4px; }
.q-export-btn {
  margin: 8px; padding: 6px; border-radius: 6px; border: 1px solid #c9a0ff;
  background: #2a1a4a; color: #c9a0ff; cursor: pointer;
  font-size: 0.75em; text-align: center; transition: all 0.2s;
}
.q-export-btn:hover { background: #3a2a5a; }
.q-empty { color: #444; font-size: 0.8em; text-align: center; padding: 30px 10px; }

/* ── Main content ── */
.main {
  flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
.main-header {
  padding: 12px 24px; border-bottom: 1px solid #2a2a4a;
  display: flex; align-items: center; gap: 16px; min-height: 50px;
}
.main-header h1 { color: #c9a0ff; font-size: 1.15em; flex: 1; }
.main-header .meta { color: #666; font-size: 0.78em; }
.main-body {
  flex: 1; overflow-y: auto; padding: 20px 30px;
}
.main-body::-webkit-scrollbar { width: 6px; }
.main-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.main-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: #444; font-size: 0.95em;
}
.main-empty-guide {
  align-items: center; justify-content: center; padding: 20px;
}
.guide-card {
  width: min(100%, 520px); background: #1e1e3a; border: 1px solid #2a2a4a;
  border-radius: 14px; padding: 24px; box-shadow: 0 10px 28px rgba(0,0,0,0.35);
}
.guide-card h3 { color: #c9a0ff; font-size: 1.2em; margin-bottom: 12px; }
.guide-card ol {
  padding-left: 1.2em; color: #cfcfe6; margin-bottom: 18px;
}
.guide-card li { margin: 6px 0; }
.guide-actions {
  display: flex; flex-wrap: wrap; gap: 10px;
}
.guide-actions .sb-btn { flex: 0 0 auto; min-width: 150px; }
.msg { margin: 10px 0; padding: 14px 18px; border-radius: 10px; }
.label {
  font-size: 0.72em; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 6px; opacity: 0.7;
}
.user { background: #16213e; border-left: 3px solid #4fc3f7; }
.user .label { color: #4fc3f7; }

/* ── Fixed current-question bar ── */
.current-q-bar {
  display: none; position: sticky; top: 0; z-index: 10;
  background: #16213e; border-bottom: 1px solid #2a3a5a;
  border-left: 3px solid #4fc3f7;
  padding: 10px 18px; margin: 0 -30px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  max-height: 3.6em; overflow: hidden;
  word-break: break-all; font-size: 0.92em;
  cursor: pointer; transition: max-height 0.2s;
}
.current-q-bar.show { display: block; }
.current-q-bar.expanded { max-height: none; overflow-y: auto; overscroll-behavior: contain; }
.current-q-bar.expanded::-webkit-scrollbar { width: 3px; }
.current-q-bar.expanded::-webkit-scrollbar-thumb { background: #4fc3f7; border-radius: 2px; }
.current-q-bar .q-tag {
  color: #4fc3f7; font-size: 0.72em; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-right: 8px;
}
.ai { background: #1e1e3a; border-left: 3px solid #c9a0ff; }
.ai .label { color: #c9a0ff; }
.ai p { margin: 5px 0; }
.tool { background: #1a2a1a; border-left: 3px solid #66bb6a; font-size: 0.85em; }
.tool summary { cursor: pointer; color: #66bb6a; font-size: 0.85em; }
.tool-out {
  background: #1a2a1a; border-left: 3px solid #66bb6a;
  font-size: 0.8em; opacity: 0.6; margin-top: -6px; padding: 6px 18px;
}
.thinking {
  text-align: center; color: #888;
  font-size: 0.8em; font-style: italic; padding: 6px; opacity: 0.5;
}
pre {
  background: #0d1117; color: #c9d1d9; padding: 12px; border-radius: 8px;
  overflow-x: auto; font-size: 0.83em; margin: 6px 0; line-height: 1.45;
  font-family: "Cascadia Code","Fira Code",monospace;
}
code {
  background: #2d2d4e; padding: 1px 5px; border-radius: 4px; font-size: 0.88em;
  font-family: "Cascadia Code","Fira Code",monospace;
}
pre code { background: none; padding: 0; font-size: inherit; }
strong { color: #ffd54f; }
.drop-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(26,26,46,0.92); align-items: center; justify-content: center;
}
.drop-overlay.show { display: flex; }
.drop-overlay .drop-box {
  padding: 60px 80px; border: 2px dashed #c9a0ff; border-radius: 16px;
  color: #c9a0ff; font-size: 1.2em;
}
.settings-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(8,8,18,0.78); align-items: center; justify-content: center;
  padding: 20px;
}
.settings-overlay.show { display: flex; }
.settings-modal {
  width: min(100%, 480px); max-width: 480px; max-height: min(88vh, 780px);
  overflow-y: auto; background: #1e1e3a; border-radius: 12px; padding: 24px;
  border: 1px solid #2a2a4a; box-shadow: 0 18px 40px rgba(0,0,0,0.42);
}
.settings-modal::-webkit-scrollbar { width: 6px; }
.settings-modal::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.settings-header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 18px;
}
.settings-header h3 { color: #c9a0ff; font-size: 1.05em; }
.settings-close {
  background: none; border: none; color: #888; cursor: pointer;
  font-size: 1.25em; line-height: 1; padding: 2px 6px; border-radius: 4px;
}
.settings-close:hover { color: #c9a0ff; background: rgba(201,160,255,0.08); }
.settings-section { margin-bottom: 18px; }
.settings-section h4 {
  color: #4fc3f7; font-size: 0.84em; margin-bottom: 8px;
}
.settings-help { color: #8c8ca8; font-size: 0.75em; margin-bottom: 10px; }
.settings-row {
  display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
}
.settings-input,
.settings-modal input {
  width: 100%; padding: 8px 10px; border-radius: 8px;
  border: 1px solid #2a2a4a; background: #0e0e22; color: #e5e5f0;
  outline: none; font-size: 0.82em;
}
.settings-input:focus,
.settings-modal input:focus { border-color: #4fc3f7; }
.token-row .sb-btn,
.settings-actions .sb-btn,
.guide-actions .sb-btn { flex: 0 0 auto; }
.token-status {
  min-height: 1.4em; font-size: 0.76em; color: #8c8ca8;
}
.token-status.success { color: #66bb6a; }
.token-status.error { color: #ef5350; }
.repo-check-list {
  display: flex; flex-direction: column; gap: 8px;
}
.repo-check-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px; border-radius: 8px; background: rgba(14,14,34,0.9);
  border: 1px solid #2a2a4a;
}
.repo-check-item label {
  display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0;
  cursor: default;
}
.repo-check-item input[type="checkbox"] {
  margin-top: 2px; accent-color: #4fc3f7;
}
.repo-check-main { color: #ddd; font-size: 0.8em; }
.repo-check-meta { color: #777; font-size: 0.72em; margin-top: 2px; }
.repo-remove {
  border: 1px solid #3a3a58; background: #1a1a3a; color: #aaa;
  border-radius: 6px; padding: 4px 8px; font-size: 0.72em; cursor: pointer;
}
.repo-remove:hover { color: #ef5350; border-color: #ef5350; }
.settings-form {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
}
.settings-empty {
  color: #666; font-size: 0.78em; padding: 10px 0;
}
.settings-actions {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end;
}
</style>
</head>
<body>

<!-- File sidebar -->
<div class="sidebar-files collapsed" id="sidebarFiles">
  <div class="sb-header">
    <button class="sb-toggle" id="toggleFiles" title="展开/收起">☰</button>
    <h2>对话记录</h2>
    <input class="file-search" id="fileSearch" placeholder="搜索文件…">
    <div class="sb-actions">
      <button class="sb-btn" id="refreshBtn">刷新</button>
      <button class="sb-btn" id="scanBtn">选择目录</button>
      <button class="sb-btn" id="dropBtn">拖入文件</button>
      <button class="sb-btn" id="settingsBtn" title="设置">⚙</button>
    </div>
    <div class="sb-status" id="sbStatus">正在扫描…</div>
  </div>
  <div class="file-items" id="fileItems"></div>
  <input type="file" id="fileInput" accept=".txt" style="display:none">
</div>

<!-- Questions sidebar -->
<div class="sidebar-questions collapsed" id="sidebarQuestions">
  <div class="sb-header">
    <button class="sb-toggle" id="toggleQuestions" title="展开/收起">☰</button>
    <h3>提问列表</h3>
    <span class="q-count" id="qCount"></span>
  </div>
  <div class="q-items" id="qItems">
    <div class="q-empty">选择一个对话文件</div>
  </div>
  <div class="q-export-btn" id="qExport">导出所有提问</div>
</div>

<!-- Main content -->
<div class="main">
  <div class="main-header" id="mainHeader">
    <h1 id="title">Claude Code 对话查看器</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="main-body" id="mainBody">
    <div class="current-q-bar" id="currentQBar"></div>
    <div class="main-empty">选择左侧文件开始浏览</div>
  </div>
</div>

<!-- Drop overlay -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-box">拖放 .txt 文件到此处</div>
</div>

<!-- Settings modal -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-header">
      <h3 id="settingsTitle">GitHub 设置</h3>
      <button class="settings-close" id="settingsClose" title="关闭">×</button>
    </div>

    <div class="settings-section">
      <h4>访问 Token</h4>
      <div class="settings-help">输入 GitHub PAT 后即可访问私有仓库聊天记录。未设置时仍可浏览公开仓库。</div>
      <div class="settings-row token-row">
        <input class="settings-input" id="tokenInput" type="password" placeholder="粘贴 GitHub Token">
        <button class="sb-btn" id="toggleTokenBtn">显示</button>
      </div>
      <div class="settings-row">
        <button class="sb-btn" id="testTokenBtn">测试连接</button>
        <button class="sb-btn" id="clearTokenBtn">清除 Token</button>
      </div>
      <div class="token-status" id="tokenStatus"></div>
    </div>

    <div class="settings-section">
      <h4>预设仓库</h4>
      <div class="settings-help">以下仓库来自 `chat-config.json`，会在设置好 Token 后自动扫描。</div>
      <div class="repo-check-list" id="defaultRepoList"></div>
    </div>

    <div class="settings-section">
      <h4>自定义仓库</h4>
      <div class="repo-check-list" id="customRepoList"></div>
    </div>

    <div class="settings-section">
      <h4>添加自定义仓库</h4>
      <div class="settings-form">
        <input class="settings-input" id="customOwnerInput" placeholder="owner">
        <input class="settings-input" id="customRepoInput" placeholder="repo">
        <input class="settings-input" id="customBranchInput" placeholder="branch（默认 main）">
        <input class="settings-input" id="customLabelInput" placeholder="标签（可选）">
      </div>
      <div class="settings-row" style="margin-top:10px;">
        <button class="sb-btn" id="addRepoBtn">添加仓库</button>
      </div>
    </div>

    <div class="settings-actions">
      <button class="sb-btn" id="saveSettingsBtn">保存</button>
    </div>
  </div>
</div>

<script>
// === DOM refs ===
const fileItems = document.getElementById('fileItems');
const fileSearch = document.getElementById('fileSearch');
const sbStatus = document.getElementById('sbStatus');
const scanBtn = document.getElementById('scanBtn');
const dropBtn = document.getElementById('dropBtn');
const refreshBtn = document.getElementById('refreshBtn');
const settingsBtn = document.getElementById('settingsBtn');
const fileInput = document.getElementById('fileInput');
const qItems = document.getElementById('qItems');
const qCount = document.getElementById('qCount');
const qExport = document.getElementById('qExport');
const mainBody = document.getElementById('mainBody');
const titleEl = document.getElementById('title');
const metaEl = document.getElementById('meta');
const dropOverlay = document.getElementById('dropOverlay');
const sidebarFiles = document.getElementById('sidebarFiles');
const sidebarQuestions = document.getElementById('sidebarQuestions');
const toggleFiles = document.getElementById('toggleFiles');
const toggleQuestions = document.getElementById('toggleQuestions');
const currentQBar = document.getElementById('currentQBar');
const settingsOverlay = document.getElementById('settingsOverlay');
const settingsClose = document.getElementById('settingsClose');
const tokenInput = document.getElementById('tokenInput');
const toggleTokenBtn = document.getElementById('toggleTokenBtn');
const testTokenBtn = document.getElementById('testTokenBtn');
const clearTokenBtn = document.getElementById('clearTokenBtn');
const tokenStatus = document.getElementById('tokenStatus');
const defaultRepoList = document.getElementById('defaultRepoList');
const customRepoList = document.getElementById('customRepoList');
const customOwnerInput = document.getElementById('customOwnerInput');
const customRepoInput = document.getElementById('customRepoInput');
const customBranchInput = document.getElementById('customBranchInput');
const customLabelInput = document.getElementById('customLabelInput');
const addRepoBtn = document.getElementById('addRepoBtn');
const saveSettingsBtn = document.getElementById('saveSettingsBtn');

// === State ===
const CONFIG_FILE = 'chat-config.json';
const TOKEN_KEY = 'chat-viewer-token';
const REPOS_KEY = 'chat-viewer-repos';
const CACHE_PREFIX = 'chat-files-';
let scannedFiles = [], currentMessages = [], activeFileEl = null, activeFileKey = '';
let isClickScrolling = false, lastStuckIndex = -1, scrollObserver = null;
let configLoaded = false, configRepos = [], customRepos = loadStoredRepos(), mergedRepos = mergeRepoLists([], customRepos);
let tokenGuideDismissed = false;

// === Sidebar toggles ===
toggleFiles.addEventListener('click', () => sidebarFiles.classList.toggle('collapsed'));
toggleQuestions.addEventListener('click', () => sidebarQuestions.classList.toggle('collapsed'));

// === IndexedDB for FS handles ===
const DB_NAME = 'chat-viewer', STORE = 'handles', KEY = 'lastDir';
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveDirHandle(handle) {
  try { const db = await openDB(); const tx = db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(handle, KEY); } catch(e) {}
}
async function loadDirHandle() {
  try { const db = await openDB(); return new Promise(r => { const tx = db.transaction(STORE); const req = tx.objectStore(STORE).get(KEY); req.onsuccess = () => r(req.result || null); req.onerror = () => r(null); }); } catch(e) { return null; }
}

// === Text helpers ===
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtInline(t) {
  t = esc(t);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return t.replace(/`([^`]+)`/g, '<code>$1</code>');
}

// === Date helpers ===
function parseFileDate(name) {
  const m = name.match(/^(\d{4})-(\d{2})-(\d{2})-(\d{2})(\d{2})(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]);
  return null;
}
function formatDate(d) {
  if (!d) return '';
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return d.getFullYear() + '-' + mm + '-' + dd + ' ' + hh + ':' + mi;
}

// === Hosting platform detection ===
function detectHosting() {
  // GitHub Pages: username.github.io
  const ghMatch = location.hostname.match(/^(.+)\.github\.io$/);
  if (ghMatch) {
    const owner = ghMatch[1];
    const pathParts = location.pathname.split('/').filter(Boolean);
    let repo, siteBase;
    if (pathParts.length >= 1 && !pathParts[0].includes('.')) {
      repo = pathParts[0];
      siteBase = location.origin + '/' + repo + '/';
    } else {
      repo = owner + '.github.io';
      siteBase = location.origin + '/';
    }
    return { type: 'github', owner, repo, siteBase };
  }
  // Gitee Pages: username.gitee.io
  const geMatch = location.hostname.match(/^(.+)\.gitee\.io$/);
  if (geMatch) {
    const owner = geMatch[1];
    const pathParts = location.pathname.split('/').filter(Boolean);
    let repo, siteBase;
    if (pathParts.length >= 1 && !pathParts[0].includes('.')) {
      repo = pathParts[0];
      siteBase = location.origin + '/' + repo + '/';
    } else {
      repo = owner;
      siteBase = location.origin + '/';
    }
    return { type: 'gitee', owner, repo, siteBase };
  }
  return null;
}

// === URL query params ===
function getUrlParam(key) {
  return new URLSearchParams(location.search).get(key);
}

// === Repo config helpers ===
function normalizeRepoConfig(repo) {
  if (!repo || !repo.owner || !repo.repo) return null;
  const owner = String(repo.owner).trim();
  const name = String(repo.repo).trim();
  if (!owner || !name) return null;
  const branch = String(repo.branch || 'main').trim() || 'main';
  const label = String(repo.label || name).trim() || name;
  return { owner, repo: name, branch, label };
}
function repoIdentity(repo) {
  return String(repo.owner || '').toLowerCase() + '/' + String(repo.repo || '').toLowerCase();
}
function repoStorageKey(repo) {
  return repoIdentity(repo) + '@' + String(repo.branch || '').toLowerCase();
}
function mergeRepoLists(defaultRepos, extraRepos) {
  const map = new Map();
  [...defaultRepos, ...extraRepos].forEach(repo => {
    const normalized = normalizeRepoConfig(repo);
    if (!normalized) return;
    const key = repoStorageKey(normalized);
    if (!map.has(key)) map.set(key, normalized);
  });
  return [...map.values()];
}
function loadStoredRepos() {
  try {
    const raw = localStorage.getItem(REPOS_KEY);
    if (!raw) return [];
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) return [];
    return data.map(normalizeRepoConfig).filter(Boolean);
  } catch (e) {
    return [];
  }
}
function saveStoredRepos(repos) {
  localStorage.setItem(REPOS_KEY, JSON.stringify(mergeRepoLists([], repos)));
}
function getStoredToken() {
  return (localStorage.getItem(TOKEN_KEY) || '').trim();
}
function setStoredToken(token) {
  if (token) localStorage.setItem(TOKEN_KEY, token);
  else localStorage.removeItem(TOKEN_KEY);
}
function getRepoLabel(item) {
  return item.repoLabel || item.label || item.repo || '默认仓库';
}
function getRepoGroupKey(file) {
  if (file.owner && file.repo) return 'repo:' + repoIdentity(file);
  return 'label:' + getRepoLabel(file);
}
function getFileKey(file) {
  return [file.owner || '', file.repo || '', file.branch || '', file.path].join('::');
}
function getDisplayName(file) {
  return file.name.replace(/\.txt$/i, '').replace(/^\d{4}-\d{2}-\d{2}-\d{6}-?/, '') || file.name.replace(/\.txt$/i, '');
}
function encodePathSegments(path) {
  return String(path || '').split('/').map(part => encodeURIComponent(part)).join('/');
}
function buildGitHubTreeUrl(owner, repo, branch) {
  return 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo)
    + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1';
}
function buildGitHubRawUrl(owner, repo, branch, path) {
  return 'https://raw.githubusercontent.com/' + encodeURIComponent(owner) + '/'
    + encodeURIComponent(repo) + '/' + encodeURIComponent(branch) + '/' + encodePathSegments(path);
}
function buildGitHubContentUrl(owner, repo, branch, path) {
  return 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/'
    + encodeURIComponent(repo) + '/contents/' + encodePathSegments(path)
    + '?ref=' + encodeURIComponent(branch);
}
function getPublicCacheKey(hosting) {
  return CACHE_PREFIX + 'host-' + hosting.type + '-' + hosting.owner + '-' + hosting.repo;
}
function getAuthCacheKey(owner, repo, branch) {
  return CACHE_PREFIX + 'auth-github-' + owner + '-' + repo + '-' + branch;
}
function enrichFile(file, meta) {
  return {
    name: file.name,
    path: file.path,
    url: file.url,
    source: file.source,
    handle: file.handle,
    repoLabel: meta && meta.repoLabel ? meta.repoLabel : (file.repoLabel || ''),
    owner: meta && meta.owner ? meta.owner : (file.owner || ''),
    repo: meta && meta.repo ? meta.repo : (file.repo || ''),
    branch: meta && meta.branch ? meta.branch : (file.branch || '')
  };
}
async function loadChatConfig() {

    if (!r.ok) return [];
    const data = await r.json();

    return repos.map(normalizeRepoConfig).filter(Boolean);
  } catch (e) {
    return [];
  }
}
async function ensureConfigLoaded(force) {

// === Manifest loading ===
async function loadManifest(siteBase, meta) {
  try {
    const r = await fetch(siteBase + 'chat-manifest.json', { cache: 'no-cache' });
    if (!r.ok) return [];
    const data = await r.json();
    const paths = Array.isArray(data) ? data : (data.files || []);
    return paths.filter(p => {
      const s = typeof p === 'string' ? p : (p && p.path);
      return s && s.endsWith('.txt');
    }).map(p => {
      const path = typeof p === 'string' ? p : p.path;
      const name = path.split('/').pop();
      return enrichFile({ name, path, url: siteBase + encodeURI(path), source: 'http' }, meta);
    });
  } catch(e) { return []; }
}

// === localStorage cache (1 hour TTL) ===
const CACHE_TTL = 3600000;
function loadCache(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data.ts && Date.now() - data.ts < CACHE_TTL && data.files && data.files.length)
      return data.files;
    localStorage.removeItem(key);
  } catch(e) {}
  return null;
}
function saveCache(key, files) {
  try {
    const clean = files.map(f => ({
      name: f.name,
      path: f.path,
      url: f.url,
      source: f.source,
      repoLabel: f.repoLabel || '',
      owner: f.owner || '',
      repo: f.repo || '',
      branch: f.branch || ''
    }));
    localStorage.setItem(key, JSON.stringify({ files: clean, ts: Date.now() }));
  } catch(e) {}
}
function clearScanCaches() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.forEach(key => {
    if (key && key.startsWith(CACHE_PREFIX)) localStorage.removeItem(key);
  });
}

// === GitHub API: try main → master → gh-pages ===
function getBranchCandidates(preferred) {
  return [...new Set([preferred, 'main', 'master', 'gh-pages'].filter(Boolean))];
}
async function scanGitHubAPI(owner, repo, siteBase, options) {
  const token = options && options.token ? options.token : '';
  const meta = options && options.meta ? options.meta : {};
  const headers = { 'Accept': 'application/vnd.github+json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const branches = getBranchCandidates(meta.branch);
  for (const branch of branches) {
    try {
      const r = await fetch(buildGitHubTreeUrl(owner, repo, branch), { headers, cache: 'no-cache' });
      if (!r.ok) continue;
      const data = await r.json();
      const results = [];
      for (const item of (data.tree || [])) {
        if (item.type === 'blob' && item.path.endsWith('.txt')) {
          const name = item.path.split('/').pop();
          results.push(enrichFile({
            name,
            path: item.path,
            url: siteBase ? siteBase + encodeURI(item.path) : buildGitHubRawUrl(owner, repo, branch, item.path),
            source: token ? 'github' : 'http'
          }, {
            repoLabel: meta.repoLabel || meta.label || repo,
            owner,
            repo,
            branch
          }));
        }
      }
      if (results.length) return results;
    } catch(e) { continue; }
  }
  return [];
}

// === Gitee API ===
async function scanGiteeAPI(owner, repo, siteBase, meta) {
  const branches = [...new Set([meta && meta.branch, 'main', 'master'].filter(Boolean))];
  for (const branch of branches) {
    try {
      const r = await fetch(
        'https://gitee.com/api/v5/repos/' + owner + '/' + repo + '/git/trees/' + branch + '?recursive=1',
        { cache: 'no-cache' }
      );
      if (!r.ok) continue;
      const data = await r.json();
      const results = [];
      for (const item of (data.tree || [])) {
        if (item.type === 'blob' && item.path.endsWith('.txt')) {
          const name = item.path.split('/').pop();
          results.push(enrichFile({
            name,
            path: item.path,
            url: siteBase + encodeURI(item.path),
            source: 'http'
          }, {
            repoLabel: meta && meta.repoLabel ? meta.repoLabel : repo,
            owner: '',
            repo: '',
            branch
          }));
        }
      }
      if (results.length) return results;
    } catch(e) { continue; }
  }
  return [];
}

function getPublicRepoMeta(hosting) {
  const matched = hosting && hosting.type === 'github'
    ? mergedRepos.find(repo => repoIdentity(repo) === repoIdentity(hosting))
    : null;
  return {
    repoLabel: matched ? matched.label : (hosting ? hosting.repo : '公开仓库'),
    owner: hosting && hosting.type === 'github' ? hosting.owner : '',
    repo: hosting && hosting.type === 'github' ? hosting.repo : '',
    branch: matched ? matched.branch : ''
  };
}
async function scanConfiguredRepo(repo, token) {
  const cacheKey = getAuthCacheKey(repo.owner, repo.repo, repo.branch);
  const cached = loadCache(cacheKey);
  if (cached && cached.length) {
    return cached.map(file => enrichFile(file, {
      repoLabel: repo.label,
      owner: repo.owner,
      repo: repo.repo,
      branch: file.branch || repo.branch
    }));
  }
  const files = await scanGitHubAPI(repo.owner, repo.repo, '', {
    token,
    meta: { repoLabel: repo.label, owner: repo.owner, repo: repo.repo, branch: repo.branch }
  });
  if (files.length) saveCache(cacheKey, files);
  return files;
}
function compareFiles(a, b) {
  const da = parseFileDate(a.name), db = parseFileDate(b.name);
  if (da && db) return db - da;
  if (da) return -1;
  if (db) return 1;
  return a.path.localeCompare(b.path);
}

// === Main auto-scan: 5-tier strategy ===
async function autoScan() {
  sbStatus.textContent = '正在扫描…';
  await ensureConfigLoaded();
  const targetFile = getUrlParam('file');
  const token = getStoredToken();

  if (!token) {
    const publicFiles = await scanCurrentPublicRepo(targetFile, tokenGuideDismissed || !mergedRepos.length);
    if (mergedRepos.length && !tokenGuideDismissed) {
      sbStatus.textContent = publicFiles.length
        ? publicFiles.length + ' 个公开文件，可配置 Token 浏览全部仓库'
        : '配置 Token 后可浏览私有仓库';
      showTokenGuide();
      return;
    }
    if (!publicFiles.length && !mergedRepos.length) showSimpleEmpty('请选择左侧文件开始浏览');
    return;
  }

  if (!mergedRepos.length) {
    const publicFiles = await scanCurrentPublicRepo(targetFile, true);
    if (!publicFiles.length) showSimpleEmpty('未配置仓库，请先修改 chat-config.json 或添加自定义仓库');
    return;
  }

  sbStatus.textContent = '正在扫描 ' + mergedRepos.length + ' 个仓库…';
  const repoResults = await Promise.all(mergedRepos.map(repo => scanConfiguredRepo(repo, token)));
  scannedFiles = repoResults.flat().sort(compareFiles);
  renderFileItems(fileSearch.value);
  if (scannedFiles.length) {
    sbStatus.textContent = scannedFiles.length + ' 个文件';
    autoLoadFile(targetFile);
  } else {
    sbStatus.textContent = '未找到聊天记录';
    showSimpleEmpty('未找到可访问的聊天记录，请检查 Token 是否有效，以及仓库配置是否正确。');
  }
}

// === Background API refresh (non-blocking) ===
async function refreshFromAPI(hosting, cacheKey, meta) {
  try {
    const files = hosting.type === 'github'
      ? await scanGitHubAPI(hosting.owner, hosting.repo, hosting.siteBase, { meta })
      : await scanGiteeAPI(hosting.owner, hosting.repo, hosting.siteBase, meta);
    if (!files.length) return;
    const oldKeys = new Set(scannedFiles.map(file => getFileKey(file)));
    const newKeys = new Set(files.map(file => getFileKey(file)));
    const changed = files.length !== scannedFiles.length
      || files.some(file => !oldKeys.has(getFileKey(file)))
      || scannedFiles.some(file => !newKeys.has(getFileKey(file)));
    if (changed) {
      scannedFiles = files;
      saveCache(cacheKey, files);
      renderFileItems(fileSearch.value);
      if (!activeFileKey && !tokenGuideDismissed && !getStoredToken() && mergedRepos.length) showTokenGuide();
    } else {
      saveCache(cacheKey, files);
    }
  } catch(e) {}
}

// === Auto-load: by ?file= param or latest by date ===
function fileMatchesTarget(file, target) {
  const normalized = decodeURIComponent(target || '').replace(/^\/+/, '').toLowerCase();
  if (!normalized) return false;
  const aliases = [
    file.path,
    file.name,
    (file.owner && file.repo ? file.owner + '/' + file.repo + '/' + file.path : ''),
    (file.owner && file.repo ? file.owner + '/' + file.repo + '@' + (file.branch || '') + '/' + file.path : '')
  ].filter(Boolean).map(item => item.toLowerCase());
  return aliases.includes(normalized);
}
function autoLoadFile(targetPath) {
  if (!scannedFiles.length) return;
  let target = null;
  if (targetPath) target = scannedFiles.find(file => fileMatchesTarget(file, targetPath));
  if (!target) {
    const withDates = scannedFiles
      .map(file => ({ file, date: parseFileDate(file.name) }))
      .filter(item => item.date)
      .sort((a, b) => b.date - a.date);
    target = withDates.length ? withDates[0].file : [...scannedFiles].sort(compareFiles)[0];
  }
  if (!target) return;
  const targetKey = getFileKey(target);
  const items = fileItems.querySelectorAll('.file-item');
  for (const el of items) {
    if (el.dataset.fileKey === targetKey) {
      selectFile(target, el);
      return;
    }
  }
}

// === Directory index crawling ===
async function crawlIndex(baseUrl, prefix, meta) {
  const results = [];
  try {
    const url = baseUrl + (prefix ? prefix + '/' : '');
    const r = await fetch(url, { cache: 'no-cache' });
    if (!r.ok) return results;
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('text/html')) return results;
    const html = await r.text();
    if (!html.includes('Index of') && !html.includes('<pre>')) return results;
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const links = [...doc.querySelectorAll('a')]
      .map(a => decodeURIComponent(a.getAttribute('href') || ''));
    for (const href of links) {
      if (href === '../' || href.startsWith('?') || href.startsWith('/')) continue;
      const clean = href.replace(/\/$/, '');
      const rel = prefix ? prefix + '/' + clean : clean;
      if (href.endsWith('/')) {
        results.push(...await crawlIndex(baseUrl, rel, meta));
      } else if (clean.endsWith('.txt')) {
        results.push(enrichFile({ name: clean, path: rel, url: baseUrl + encodeURI(rel), source: 'http' }, meta));
      }
    }
  } catch (e) {}
  return results;
}

// === Manual directory scan ===
async function manualScan() {
  if (!window.showDirectoryPicker) { alert('请使用 Chrome / Edge'); return; }
  try {
    const dh = await window.showDirectoryPicker();
    sbStatus.textContent = '扫描中…';
    scannedFiles = await fsWalk(dh, '', '本地目录');
    await saveDirHandle(dh);
    renderFileItems(fileSearch.value);
    sbStatus.textContent = scannedFiles.length + ' 个文件';
  } catch (e) { if (e.name !== 'AbortError') sbStatus.textContent = '扫描失败'; }
}
async function fsWalk(dh, prefix, repoLabel) {
  const r = [];
  for await (const [name, handle] of dh) {
    const rel = prefix ? prefix + '/' + name : name;
    if (handle.kind === 'file' && name.endsWith('.txt'))
      r.push(enrichFile({ name, path: rel, handle, source: 'fs', url: '' }, { repoLabel }));
    else if (handle.kind === 'directory')
      r.push(...await fsWalk(handle, rel, repoLabel));
  }
  return r;
}

async function scanCurrentPublicRepo(targetFile, autoLoadAfterScan) {
  const hosting = detectHosting();
  if (hosting) {
    const meta = getPublicRepoMeta(hosting);
    const cacheKey = getPublicCacheKey(hosting);
    sbStatus.textContent = '加载清单…';
    const manifestFiles = await loadManifest(hosting.siteBase, meta);
    if (manifestFiles.length) {
      scannedFiles = manifestFiles;
      renderFileItems(fileSearch.value);
      sbStatus.textContent = manifestFiles.length + ' 个文件';
      if (autoLoadAfterScan) autoLoadFile(targetFile);
      return manifestFiles;
    }
    const cached = loadCache(cacheKey);
    if (cached && cached.length) {
      scannedFiles = cached.map(file => enrichFile(file, meta));
      renderFileItems(fileSearch.value);
      sbStatus.textContent = scannedFiles.length + ' 个文件 (缓存)';
      if (autoLoadAfterScan) autoLoadFile(targetFile);
      refreshFromAPI(hosting, cacheKey, meta);
      return scannedFiles;
    }
    sbStatus.textContent = '查询 ' + (hosting.type === 'github' ? 'GitHub' : 'Gitee') + ' API…';
    const apiFiles = hosting.type === 'github'
      ? await scanGitHubAPI(hosting.owner, hosting.repo, hosting.siteBase, { meta })
      : await scanGiteeAPI(hosting.owner, hosting.repo, hosting.siteBase, meta);
    if (apiFiles.length) {
      scannedFiles = apiFiles;
      saveCache(cacheKey, apiFiles);
      renderFileItems(fileSearch.value);
      sbStatus.textContent = apiFiles.length + ' 个文件';
      if (autoLoadAfterScan) autoLoadFile(targetFile);
      return apiFiles;
    }
    sbStatus.textContent = 'API 未返回结果，尝试其他方式…';
  }

  if (location.protocol.startsWith('http')) {
    try {
      const base = new URL('.', location.href).href;
      const found = await crawlIndex(base, '', getPublicRepoMeta(hosting));
      if (found.length) {
        scannedFiles = found;
        renderFileItems(fileSearch.value);
        sbStatus.textContent = found.length + ' 个文件';
        if (autoLoadAfterScan) autoLoadFile(targetFile);
        return found;
      }
    } catch (e) {}
  }

  if (window.showDirectoryPicker) {
    const saved = await loadDirHandle();
    if (saved) {
      try {
        const perm = await saved.requestPermission({ mode: 'read' });
        if (perm === 'granted') {
          sbStatus.textContent = '扫描本地目录…';
          scannedFiles = await fsWalk(saved, '', '本地目录');
          renderFileItems(fileSearch.value);
          sbStatus.textContent = scannedFiles.length + ' 个文件';
          if (autoLoadAfterScan) autoLoadFile(targetFile);
          return scannedFiles;
        }
      } catch (e) {}
    }
    if (location.protocol === 'file:') {
      sbStatus.textContent = '本地模式，请选择项目目录';
      try {
        const dh = await window.showDirectoryPicker({ mode: 'read' });
        sbStatus.textContent = '扫描中…';
        scannedFiles = await fsWalk(dh, '', '本地目录');
        await saveDirHandle(dh);
        renderFileItems(fileSearch.value);
        sbStatus.textContent = scannedFiles.length + ' 个文件';
        if (autoLoadAfterScan) autoLoadFile(targetFile);
        return scannedFiles;
      } catch (e) {
        if (e.name === 'AbortError') {
          sbStatus.textContent = '已取消，可点击「选择目录」重试';
          return [];
        }
      }
    }
  }

  scannedFiles = [];
  renderFileItems(fileSearch.value);
  sbStatus.textContent = '请手动选择目录或拖入文件';
  return [];
}
async function fetchFileText(file) {
  if (file.source === 'fs') return (await file.handle.getFile()).text();
  const token = getStoredToken();
  const headers = {};
  if (file.owner && file.repo && token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(file.url, { headers, cache: 'no-cache' });
  if (r.ok) return r.text();
  if (file.owner && file.repo && token) {
    const fallback = await fetch(buildGitHubContentUrl(file.owner, file.repo, file.branch || 'main', file.path), {
      headers: {
        'Accept': 'application/vnd.github.raw+json',
        'Authorization': 'Bearer ' + token
      },
      cache: 'no-cache'
    });
    if (fallback.ok) return fallback.text();
  }
  throw new Error('文件加载失败');
}

// === File list rendering ===
function renderFileItems(filter) {
  fileItems.innerHTML = '';
  activeFileEl = null;
  const kw = String(filter || '').trim().toLowerCase();
  const list = kw
    ? scannedFiles.filter(file => [file.path, file.name, getRepoLabel(file)]
      .some(text => String(text || '').toLowerCase().includes(kw)))
    : [...scannedFiles];
  list.sort(compareFiles);
  if (!list.length) {
    fileItems.innerHTML = '<div class="q-empty">未找到文件</div>';
    return;
  }

  const repoOrder = new Map();
  mergedRepos.forEach((repo, index) => repoOrder.set(repoIdentity(repo), index));
  const groups = new Map();
  list.forEach(file => {
    const key = getRepoGroupKey(file);
    if (!groups.has(key)) {
      groups.set(key, {
        label: getRepoLabel(file),
        owner: file.owner || '',
        repo: file.repo || '',
        files: []
      });
    }
    groups.get(key).files.push(file);
  });

  const sortedGroups = [...groups.values()].sort((a, b) => {
    const ai = a.owner && a.repo && repoOrder.has(repoIdentity(a)) ? repoOrder.get(repoIdentity(a)) : Number.MAX_SAFE_INTEGER;
    const bi = b.owner && b.repo && repoOrder.has(repoIdentity(b)) ? repoOrder.get(repoIdentity(b)) : Number.MAX_SAFE_INTEGER;
    if (ai !== bi) return ai - bi;
    return a.label.localeCompare(b.label);
  });

  sortedGroups.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'repo-group';
    const title = document.createElement('div');
    title.className = 'repo-group-title';
    title.textContent = group.owner && group.repo ? group.label + ' · ' + group.owner + '/' + group.repo : group.label;
    groupEl.appendChild(title);

    group.files.forEach(file => {
      const div = document.createElement('div');
      const fileKey = getFileKey(file);
      div.className = 'file-item' + (activeFileKey === fileKey ? ' active' : '');
      div.dataset.fileKey = fileKey;
      const d = parseFileDate(file.name);
      const dateStr = formatDate(d);
      div.innerHTML = '<div class="fname"><span class="repo-tag">' + esc(getRepoLabel(file)) + '</span>'
        + esc(getDisplayName(file)) + '</div>'
        + (dateStr ? '<div class="fdate">' + esc(dateStr) + '</div>' : '')
        + '<div class="fpath">' + esc(file.path) + '</div>';
      div.addEventListener('click', () => selectFile(file, div));
      div.addEventListener('dblclick', e => { e.stopPropagation(); div.classList.toggle('expanded'); });
      if (activeFileKey === fileKey) activeFileEl = div;
      groupEl.appendChild(div);
    });

    fileItems.appendChild(groupEl);
  });

  if (list.length) sidebarFiles.classList.remove('collapsed');
}

async function selectFile(f, el) {
  try {
    if (activeFileEl) activeFileEl.classList.remove('active');
    el.classList.add('active');
    activeFileEl = el;
    activeFileKey = getFileKey(f);
    const text = await fetchFileText(f);
    const msgs = parseConversation(text);
    renderMessages(msgs, f.name.replace(/\.txt$/i, ''), f);
    renderQuestions(msgs);
    sidebarQuestions.classList.remove('collapsed');
  } catch (e) {
    showSimpleEmpty('文件加载失败，请检查 Token 或仓库权限。');
    sbStatus.textContent = '文件加载失败';
  }
}

// === Questions sidebar ===
function renderQuestions(msgs) {
  qItems.innerHTML = '';
  const um = msgs.filter(m => m.role === 'user');
  qCount.textContent = um.length ? um.length + ' 条' : '';
  if (!um.length) { qItems.innerHTML = '<div class="q-empty">无提问</div>'; return; }
  um.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = 'q-item';
    div.innerHTML = '<span class="q-num">' + (i+1) + '.</span> '
      + esc(m.lines.join(' ').trim());
    div.addEventListener('click', () => {
      const targets = mainBody.querySelectorAll('.msg.user');
      if (targets[i]) {
        isClickScrolling = true;
        targets[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
        targets[i].style.outline = '2px solid #4fc3f7';
        setTimeout(() => { targets[i].style.outline = ''; isClickScrolling = false; }, 800);
      }
      qItems.querySelectorAll('.q-item').forEach(q => q.classList.remove('active'));
      div.classList.add('active');
    });
    div.addEventListener('dblclick', e => { e.stopPropagation(); div.classList.toggle('expanded'); });
    qItems.appendChild(div);
  });
}

qExport.addEventListener('click', () => {
  const q = currentMessages.filter(m => m.role === 'user')
    .map((m, i) => (i+1) + '. ' + m.lines.join('\n').trim()).join('\n\n');
  if (!q) { alert('没有提问'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([q], {type:'text/plain;charset=utf-8'}));
  a.download = (titleEl.textContent || 'q') + '-提问导出.txt';
  a.click(); URL.revokeObjectURL(a.href);
});

// === Events ===
scanBtn.addEventListener('click', manualScan);
dropBtn.addEventListener('click', () => fileInput.click());
refreshBtn.addEventListener('click', async () => {
  clearScanCaches();
  scannedFiles = [];
  fileItems.innerHTML = '';

});
settingsBtn.addEventListener('click', async () => {

fileSearch.addEventListener('input', e => renderFileItems(e.target.value));
document.addEventListener('dragover', e => { e.preventDefault(); dropOverlay.classList.add('show'); });
dropOverlay.addEventListener('dragleave', () => dropOverlay.classList.remove('show'));
dropOverlay.addEventListener('drop', e => {
  e.preventDefault(); dropOverlay.classList.remove('show');

});
settingsClose.addEventListener('click', closeSettingsModal);

document.addEventListener('keydown', e => {

toggleTokenBtn.addEventListener('click', () => {
  const nextType = tokenInput.type === 'password' ? 'text' : 'password';
  tokenInput.type = nextType;

testTokenBtn.addEventListener('click', async () => {

  }

clearTokenBtn.addEventListener('click', async () => {

addRepoBtn.addEventListener('click', () => {

});
saveSettingsBtn.addEventListener('click', async () => {
  if (!addCustomRepoFromForm()) return;
  setStoredToken(tokenInput.value.trim());
  saveStoredRepos(customRepos);
  clearScanCaches();
  tokenGuideDismissed = false;
  closeSettingsModal();
  await autoScan();
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const msgs = parseConversation(e.target.result);
    renderMessages(msgs, file.name.replace(/\.txt$/i, ''), { repoLabel: '临时文件' });
    renderQuestions(msgs);
    sidebarQuestions.classList.remove('collapsed');
  };
  reader.readAsText(file, 'utf-8');
}

// === Parser ===
function parseConversation(text) {
  const lines = text.split('\n'), msgs = [];
  let cur = null, started = false;
  for (const line of lines) {
    const s = line.trimStart();
    if (!started) {
      if (s.startsWith('> ') || s.startsWith('\u25cf ')) started = true; else continue;
    }
    if (s.startsWith('> ')) {
      if (cur) msgs.push(cur); cur = {role:'user', lines:[s.slice(2)]};
    } else if (s.startsWith('\u25cf ')) {
      const c = s.slice(2);
      if (/^(Write|Bash|Read|Glob|Grep|Searched|Edit|Agent|Task)[\s(]/.test(c)) {
        if (cur) msgs.push(cur); cur = {role:'tool', lines:[c]};
      } else if (cur && cur.role==='assistant') cur.lines.push(c);
      else { if (cur) msgs.push(cur); cur = {role:'assistant', lines:[c]}; }
    } else if (s.startsWith('\u273b ')) {
      if (cur) msgs.push(cur); cur = {role:'thinking', lines:[s.slice(2)]};
    } else if (s.startsWith('\u23bf') || s.startsWith('\u2e1f')) {
      const c = s.slice(1).trimStart();
      if (cur && cur.role==='tool') cur.lines.push(c);
      else { if (cur) msgs.push(cur); cur = {role:'tool_output', lines:[c]}; }
    } else if (s && cur) cur.lines.push(s);
    else if (!s && cur) cur.lines.push('');
  }
  if (cur) msgs.push(cur);
  return msgs;
}

function isCodeLine(line) {
  if (!line || !line.trim()) return false;
  const s = line.trim();
  return /^[┌├│└┬┤┐┘┼─\s]+$/.test(s) || /^[│┌├└].*[│┐┤┘]$/.test(s)
    || /^[#.oOX@%*+=\-:|_ ]{6,}$/.test(s) || /^[\-=]{4,}/.test(s)
    || /^\d+\s*[|]/.test(s) || /^[|+\-]{3,}/.test(s)
    || /^(def |class |import |from |print|for |if |>>>|\.\.\.)/.test(s)
    || /^(#\d|→|←|↓|↑)/.test(s) || /^\w+\s*[:=].*[|→←]/.test(s);
}

function renderAssistant(text) {
  const lines = text.split('\n');
  let html = '', buf = [], inC = false, ec = 0;
  function flush() {
    if (buf.length) {
      while (buf.length && !buf[buf.length-1].trim()) buf.pop();
      html += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>'; buf = [];
    }
    inC = false; ec = 0;
  }
  for (const l of lines) {
    const t = l.trim();
    if (isCodeLine(t)) { if (!inC) inC = true; if (ec) { for(let i=0;i<ec;i++) buf.push(''); ec=0; } buf.push(t); }
    else if (inC && !t) { ec++; if (ec > 1) flush(); }
    else { flush(); html += t ? '<p>'+fmtInline(t)+'</p>' : '<br>'; }
  }
  flush(); return html;
}

function renderMessages(msgs, filename, fileMeta) {
  let uc = 0, qi = 0;
  msgs.forEach(m => { if (m.role === 'user') uc++; });
  titleEl.textContent = filename;
  const metaParts = [msgs.length + ' 条消息', uc + ' 轮对话'];
  if (fileMeta && fileMeta.repoLabel) metaParts.push(fileMeta.repoLabel);
  metaEl.textContent = metaParts.join(' | ');
  let out = '';
  for (const msg of msgs) {
    const text = msg.lines.join('\n').trim(); if (!text) continue;
    if (msg.role==='user') {
      out += '<div class="msg user" data-q-index="'+qi+'">'
        + '<div class="label">Q' + (qi+1) + '</div>'
        + fmtInline(text).replace(/\n/g,'<br>') + '</div>';
      qi++;
    }
    else if (msg.role==='assistant') out += '<div class="msg ai"><div class="label">Claude</div>'+renderAssistant(text)+'</div>';
    else if (msg.role==='tool') out += '<div class="msg tool"><details><summary>'+esc(text.split('\n')[0])+'</summary><pre>'+esc(text)+'</pre></details></div>';
    else if (msg.role==='tool_output') out += '<div class="msg tool-out"><pre>'+esc(text)+'</pre></div>';
    else if (msg.role==='thinking') out += '<div class="msg thinking">'+esc(text)+'</div>';
  }
  currentQBar.className = 'current-q-bar'; currentQBar.innerHTML = '';
  while (mainBody.children.length > 1) mainBody.removeChild(mainBody.lastChild);
  mainBody.insertAdjacentHTML('beforeend', out);
  currentMessages = msgs;
  mainBody.scrollTop = 0;
  setupScrollSync();
}

// === Scroll sync ===
function setupScrollSync() {
  if (scrollObserver) scrollObserver.disconnect();
  lastStuckIndex = -1;
  mainBody.removeEventListener('scroll', onMainScroll);
  mainBody.addEventListener('scroll', onMainScroll);
  onMainScroll();
}

function onMainScroll() {
  if (isClickScrolling) return;
  const bar = document.getElementById('currentQBar');
  const userEls = mainBody.querySelectorAll('.msg.user');
  if (!userEls.length) return;
  const containerTop = mainBody.getBoundingClientRect().top + bar.offsetHeight;
  let current = -1;
  for (let i = userEls.length - 1; i >= 0; i--) {
    if (userEls[i].getBoundingClientRect().top < containerTop + 2) {
      current = i; break;
    }
  }
  if (current === lastStuckIndex) return;
  lastStuckIndex = current;
  if (current >= 0) {
    const el = userEls[current];
    const qi = parseInt(el.dataset.qIndex);
    bar.innerHTML = '<span class="q-tag">Q' + (qi+1) + '</span>' + el.innerHTML.replace(/<div class="label">.*?<\/div>/, '');
    bar.classList.add('show');
    bar.classList.remove('expanded');
    syncQSidebar(qi);
  } else {
    bar.classList.remove('show');
    bar.innerHTML = '';
  }
}

function syncQSidebar(index) {
  const items = qItems.querySelectorAll('.q-item');
  if (!items.length) return;
  items.forEach(q => q.classList.remove('active'));
  if (items[index]) {
    items[index].classList.add('active');
    const container = qItems;
    const item = items[index];
    const cRect = container.getBoundingClientRect();
    const iRect = item.getBoundingClientRect();
    if (iRect.top < cRect.top || iRect.bottom > cRect.bottom) {
      item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

document.getElementById('currentQBar').addEventListener('click', function() {
  this.classList.toggle('expanded');
});

// === Launch ===
renderSettingsLists();
autoScan();
